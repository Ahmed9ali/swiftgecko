org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# GeckoView version. 145+ needs Android 8+, so a range below 145 keeps Android 5-7 working (picks the newest 142.x-144.x).
# After a green build, pin it to the exact version from the log (e.g. geckoVersion=144.0.20251010123456).
geckoVersion=[142.0,145.0)
geckoArtifact=geckoview
# ABIs packed into the APK (comma separated). armeabi-v7a = 32-bit ARM, arm64-v8a = 64-bit ARM.
# Add x86,x86_64 for emulators / Intel devices (bigger APK).
abis=armeabi-v7a,arm64-v8a
android.suppressUnsupportedCompileSdk=36
